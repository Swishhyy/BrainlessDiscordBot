name = "brainlessdiscordbot"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Keep variables you add in the Cloudflare dashboard (e.g. GUILD_ID) across deploys.
keep_vars = true

# Once an hour: re-check the slash commands and make sure the bot is online.
[triggers]
crons = ["23 * * * *"]

# Keeps the bot "online" in Discord (one always-connected Durable Object).
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]

[vars]
# Public HTTPS address of the Core stats API (through Cloudflare), no trailing slash.
API_URL = "https://api.projectbrainless.com"
COMMAND_PREFIX = "pb"
# Optional text variables you can add in the Cloudflare dashboard to change the bot's status:
#   PRESENCE_TEXT    what shows under the bot's name (default "Project Brainless · /pb-stats")
#   PRESENCE_TYPE    custom (default), playing, watching, listening or competing
#   PRESENCE_STATUS  online (default), idle or dnd
# Optional GUILD_ID (your Discord server ID): add it in the Cloudflare dashboard under
# Settings → Variables and Secrets (type Text). With it, commands register instantly and
# only answer in your server; without it they register globally.

# Secrets — set with `npx wrangler secret put <NAME>`, never put them in this file:
#   DISCORD_PUBLIC_KEY  (Discord Developer Portal → your app → General Information → Public Key)
#   API_SECRET          (same value as stats_api.shared_secret in the Core config)
#   DISCORD_TOKEN       (bot token: registers the slash commands and keeps the bot showing online)
